name: X Auto Sync

on:
  workflow_dispatch:
    inputs:
      rehearsal_date:
        description: "Dry-run event date (JST)"
        required: false
        default: "2026-09-19"
        type: string
      rehearsal_cutoff:
        description: "Dry-run cutoff time (JST)"
        required: false
        default: "18:00"
        type: string
      dry_run:
        description: "Do not change production_state.json"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "2-57/5 12-23 23 9 *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: x-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Poll and apply X sold-out posts
        shell: bash
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_TARGET_TOUR_ID: FRESHEST_2026
          X_REHEARSAL_DATE: ${{ inputs.rehearsal_date }}
          X_REHEARSAL_CUTOFF: ${{ inputs.rehearsal_cutoff }}
          X_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Tokyo merchandise sales:
          # advance sales 13:00-16:00, plus doors and post-show sales.
          # Use ~1 minute polling through a generous 21:30 buffer.
          poll_count=1
          now_jst="$(TZ=Asia/Tokyo date +%H:%M)"
          if [[ "$now_jst" > "12:59" && "$now_jst" < "21:31" ]]; then
            poll_count=6
          fi

          echo "Polling mode: count=$poll_count, interval=50s, JST=$now_jst"

          for attempt in $(seq 1 "$poll_count"); do
            echo "=== Poll $attempt/$poll_count ==="

            # Pick up any repository update made since checkout.
            if git diff --quiet; then
              git pull --rebase
            fi

            python scripts/x_auto_sync.py

            if ! git diff --quiet -- data/production_state.json; then
              git add data/production_state.json
              git commit -m "Update live inventory from X"
              git pull --rebase
              git push
              echo "Production inventory pushed."
            else
              echo "No production state change."
            fi

            if [[ "$attempt" -lt "$poll_count" ]]; then
              sleep 50
            fi
          done
